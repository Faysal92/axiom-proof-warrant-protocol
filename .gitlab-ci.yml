# AXIOM Warrant Gate — GitLab CI
# Same kernel as GitHub Actions. Different orchestrator, identical proof logic.

stages:
  - evidence
  - warrant

variables:
  AXIOM_TARGET: "payment-api"
  AXIOM_ENVIRONMENT: "production"
  AXIOM_SERVICE: "payments"

ci-evidence:
  stage: evidence
  script:
    - pip install -r requirements.txt -q
    - mkdir -p artifacts
    - |
      python examples/github_action/build_ci_report.py \
        --out artifacts/ci_report.json \
        --target "$AXIOM_TARGET" \
        --sha "$CI_COMMIT_SHA" \
        --branch "$CI_COMMIT_REF_NAME" \
        --unit-status success \
        --integration-status success \
        --unit-run-id "$CI_JOB_ID-unit" \
        --integration-run-id "$CI_JOB_ID-integration"
  artifacts:
    paths: [artifacts/ci_report.json]

security-evidence:
  stage: evidence
  script:
    - mkdir -p artifacts
    - cp examples/scanners/semgrep_clean_scan.json artifacts/semgrep_report.json
  artifacts:
    paths: [artifacts/semgrep_report.json]

review-evidence:
  stage: evidence
  script:
    - mkdir -p artifacts
    - |
      python examples/github_action/build_review_report.py \
        --out artifacts/pr_reviews.json \
        --target "$AXIOM_TARGET" \
        --sha "$CI_COMMIT_SHA" \
        --branch "$CI_COMMIT_REF_NAME" \
        --pr-number "$CI_MERGE_REQUEST_IID" \
        --scenario allow
  artifacts:
    paths: [artifacts/pr_reviews.json]

rollback-evidence:
  stage: evidence
  script:
    - mkdir -p artifacts
    - |
      python examples/github_action/build_rollback_report.py \
        --out artifacts/rollback_plan.json \
        --target "$AXIOM_TARGET" \
        --environment "$AXIOM_ENVIRONMENT" \
        --sha "$CI_COMMIT_SHA" \
        --branch "$CI_COMMIT_REF_NAME" \
        --scenario allow
  artifacts:
    paths: [artifacts/rollback_plan.json]

axiom-warrant-gate:
  stage: warrant
  dependencies: [ci-evidence, security-evidence, review-evidence, rollback-evidence]
  script:
    - pip install -r requirements.txt -q
    - |
      PYTHONPATH=reference/python python -m axiom.cli ci-proof \
        --report artifacts/ci_report.json --out artifacts/ci.pv.json \
        --target "$AXIOM_TARGET" --environment "$AXIOM_ENVIRONMENT" --service "$AXIOM_SERVICE"
    - |
      PYTHONPATH=reference/python python -m axiom.cli semgrep-proof \
        --report artifacts/semgrep_report.json --out artifacts/security.pv.json \
        --target "$AXIOM_TARGET" --environment "$AXIOM_ENVIRONMENT" --service "$AXIOM_SERVICE"
    - |
      PYTHONPATH=reference/python python -m axiom.cli review-proof \
        --report artifacts/pr_reviews.json --out artifacts/review.pv.json \
        --target "$AXIOM_TARGET" --environment "$AXIOM_ENVIRONMENT" --service "$AXIOM_SERVICE"
    - |
      PYTHONPATH=reference/python python -m axiom.cli rollback-proof \
        --report artifacts/rollback_plan.json --out artifacts/rollback.pv.json \
        --target "$AXIOM_TARGET" --environment "$AXIOM_ENVIRONMENT" --service "$AXIOM_SERVICE"
    - |
      PYTHONPATH=reference/python python -m axiom.cli merge-proof \
        --proof artifacts/ci.pv.json --proof artifacts/security.pv.json \
        --proof artifacts/review.pv.json --proof artifacts/rollback.pv.json \
        --out artifacts/final.pv.json
    - |
      PYTHONPATH=reference/python python -m axiom.cli eval \
        --action examples/deploy_payment_api.action.json \
        --proof artifacts/final.pv.json \
        --policy examples/security_policy.yml \
        --out artifacts/warrant.json \
        --ledger artifacts/ledger.jsonl
    - |
      DECISION=$(python -c "import json; print(json.load(open('artifacts/warrant.json'))['decision'])")
      echo "AXIOM Decision: $DECISION"
      if [ "$DECISION" != "ALLOW" ]; then
        echo "AXIOM refused this action: $DECISION — no merge."
        exit 1
      fi
      echo "AXIOM ALLOW — merge may proceed."
  artifacts:
    paths: [artifacts/]
    when: always
