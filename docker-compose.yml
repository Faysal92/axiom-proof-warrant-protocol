services:
  axiom-api:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    container_name: axiom-demo-api
    restart: unless-stopped
    environment:
      PYTHONPATH: /app/reference/python
      AXIOM_DEMO_MODE: "true"
    volumes:
      - axiom-ledger:/app/data
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  axiom-ui:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_AXIOM_API_BASE: /api
    container_name: axiom-demo-ui
    restart: unless-stopped
    depends_on:
      axiom-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"

volumes:
  axiom-ledger:
